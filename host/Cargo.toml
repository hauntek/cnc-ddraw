[package]
name = "ddraw-host"
version = "0.1.1"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "ddraw-host"
path = "src/main.rs"

[dependencies]
ddraw-protocol = { path = "../protocol" }
pollster = "0.4"
raw-window-handle = "0.6.2"
wgpu = { version = "27.0.1", default-features = false, features = ["std", "dx12", "vulkan", "wgsl"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
