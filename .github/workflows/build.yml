name: Rust Win32 DLL

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  win32:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust i686-pc-windows-gnullvm target and components
        run: |
          rustup target add i686-pc-windows-gnullvm
          rustup component add rustfmt clippy

      - name: Install llvm-mingw
        shell: pwsh
        run: |
          $version = "20240606"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/llvm-mingw-$version-ucrt-x86_64.zip"
          $zip = "llvm-mingw.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "C:\"
          $llvmMingwDir = Get-ChildItem "C:\" -Directory -Filter "llvm-mingw*" | Select-Object -First 1
          echo "$($llvmMingwDir.FullName)\bin" >> $env:GITHUB_PATH
          # 立即将路径加入当前会话，供后续步骤使用
          $env:PATH = "$($llvmMingwDir.FullName)\bin;$env:PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --target i686-pc-windows-gnullvm --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --locked --target i686-pc-windows-gnullvm

      - name: Build release DLL
        run: cargo build --locked --release --target i686-pc-windows-gnullvm

      - name: Verify release output exists
        shell: pwsh
        run: |
          $file = "target/i686-pc-windows-gnullvm/release/ddraw.dll"
          if (-not (Test-Path $file)) {
            Write-Error "Missing expected build output: $file"
            exit 1
          }
          Get-Item $file | Format-Table Name, Length -AutoSize

      - name: Exercise the DLL through the x86 Windows SDK ABI
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /W4 tests\smoke.c user32.lib gdi32.lib /Fe:target\i686-pc-windows-gnullvm\release\smoke.exe
          if errorlevel 1 exit /b 1
          target\i686-pc-windows-gnullvm\release\smoke.exe

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: cnc-ddraw-i686
          if-no-files-found: error
          path: target/i686-pc-windows-gnullvm/release/ddraw.dll
