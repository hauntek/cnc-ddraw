name: Rust Win32 DLL and 64-bit host

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  win32:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets and components
        run: |
          rustup target add i686-pc-windows-msvc x86_64-pc-windows-msvc
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run Clippy (32-bit DLL, advisory)
        run: cargo clippy --locked -p cnc-ddraw --all-targets

      - name: Run unit tests (32-bit DLL)
        run: cargo test --locked -p cnc-ddraw

      - name: Build release 32-bit DLL and PDB
        run: cargo build --locked --release -p cnc-ddraw --target i686-pc-windows-msvc

      - name: Build release 64-bit presentation host
        run: cargo build --locked --release -p ddraw-host --target x86_64-pc-windows-msvc

      - name: Verify release outputs exist
        shell: pwsh
        run: |
          foreach ($file in @(
            "target/i686-pc-windows-msvc/release/ddraw.dll",
            "target/i686-pc-windows-msvc/release/ddraw.pdb",
            "target/x86_64-pc-windows-msvc/release/ddraw-host.exe"
          )) {
            if (-not (Test-Path $file)) {
              Write-Error "Missing expected build output: $file"
              exit 1
            }
          }
          Get-Item target/i686-pc-windows-msvc/release/ddraw.dll,
            target/i686-pc-windows-msvc/release/ddraw.pdb,
            target/x86_64-pc-windows-msvc/release/ddraw-host.exe |
            Format-Table Name, Length -AutoSize

      - name: Exercise the DLL through the x86 Windows SDK ABI
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /W4 tests\smoke.c user32.lib gdi32.lib /Fe:target\i686-pc-windows-msvc\release\smoke.exe
          if errorlevel 1 exit /b 1
          target\i686-pc-windows-msvc\release\smoke.exe

      - name: Upload DLL, PDB, and host artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cnc-ddraw
          if-no-files-found: error
          path: |
            target/i686-pc-windows-msvc/release/ddraw.dll
            target/i686-pc-windows-msvc/release/ddraw.pdb
            target/x86_64-pc-windows-msvc/release/ddraw-host.exe
