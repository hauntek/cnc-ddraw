name: Rust Win32 DLL

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  win32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target and components
        run: |
          rustup target add i686-pc-windows-gnullvm
          rustup component add rustfmt clippy

      - name: Install llvm-mingw
        run: |
          LLVM_MINGW_VERSION="20240606"
          LLVM_MINGW_NAME="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-20.04-x86_64"
          curl -L -o "${LLVM_MINGW_NAME}.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW_NAME}.tar.xz"
          tar -xf "${LLVM_MINGW_NAME}.tar.xz"
          echo "${PWD}/${LLVM_MINGW_NAME}/bin" >> $GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --target i686-pc-windows-gnullvm --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --locked --target i686-pc-windows-gnullvm

      - name: Build release DLL
        run: cargo build --locked --release --target i686-pc-windows-gnullvm

      - name: Verify output is a 32-bit PE DLL
        run: |
          file="target/i686-pc-windows-gnullvm/release/ddraw.dll"
          if [ ! -f "$file" ]; then
            echo "Missing expected build output: $file"
            exit 1
          fi
          file "$file"
          file "$file" | grep -q "PE32" || { echo "Not a 32-bit PE file!"; exit 1; }

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: cnc-ddraw-i686
          if-no-files-found: error
          path: target/i686-pc-windows-gnullvm/release/ddraw.dll
