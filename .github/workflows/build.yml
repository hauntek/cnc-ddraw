name: Rust Win32 DLL

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  win32:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust i686-pc-windows-gnullvm target and components
        run: |
          rustup target add i686-pc-windows-gnullvm
          rustup component add rustfmt clippy

      - name: Install llvm-mingw via Homebrew
        run: |
          brew install llvm-mingw
          # Homebrew 安装的 llvm-mingw 通常链接到 /opt/homebrew/opt/llvm-mingw/bin
          echo "/opt/homebrew/opt/llvm-mingw/bin" >> $GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --target i686-pc-windows-gnullvm --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --locked --target i686-pc-windows-gnullvm

      - name: Build release DLL
        run: cargo build --locked --release --target i686-pc-windows-gnullvm

      - name: Verify release output exists
        run: |
          file="target/i686-pc-windows-gnullvm/release/ddraw.dll"
          if [ ! -f "$file" ]; then
            echo "Missing expected build output: $file"
            exit 1
          fi
          ls -lh "$file"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: cnc-ddraw-i686
          if-no-files-found: error
          path: target/i686-pc-windows-gnullvm/release/ddraw.dll
