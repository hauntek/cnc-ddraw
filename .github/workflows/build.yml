name: Rust Win32 DLL and 64-bit host (LLVM-MinGW)

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-gnullvm,x86_64-pc-windows-gnullvm

      - name: Install LLVM-MinGW (UCRT)
        run: |
          set -euo pipefail
          LLVM_MINGW_VERSION=20261117
          LLVM_MINGW_DIR="llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64"
          curl -fsSL -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${LLVM_MINGW_DIR}.tar.xz"
          tar -xJf /tmp/llvm-mingw.tar.xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${LLVM_MINGW_DIR}/bin" >> "$GITHUB_PATH"

      - name: Verify LLVM-MinGW toolchain
        run: |
          i686-w64-mingw32-clang --version
          x86_64-w64-mingw32-clang --version

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build 32-bit ddraw.dll (i686-pc-windows-gnullvm)
        run: |
          cargo build --locked --release \
            -p cnc-ddraw \
            --target i686-pc-windows-gnullvm

      - name: Build 64-bit ddraw-host.exe (x86_64-pc-windows-gnullvm)
        run: |
          cargo build --locked --release \
            -p ddraw-host \
            --target x86_64-pc-windows-gnullvm

      - name: Verify release outputs exist
        run: |
          set -euo pipefail
          for file in \
            target/i686-pc-windows-gnullvm/release/ddraw.dll \
            target/x86_64-pc-windows-gnullvm/release/ddraw-host.exe
          do
            test -f "$file" || { echo "Missing expected build output: $file"; exit 1; }
          done
          file target/i686-pc-windows-gnullvm/release/ddraw.dll
          file target/x86_64-pc-windows-gnullvm/release/ddraw-host.exe
          ls -lh target/i686-pc-windows-gnullvm/release/ddraw.dll \
            target/x86_64-pc-windows-gnullvm/release/ddraw-host.exe

      - name: Stage flat release files
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp target/i686-pc-windows-gnullvm/release/ddraw.dll dist/
          cp target/x86_64-pc-windows-gnullvm/release/ddraw-host.exe dist/
          ls -lh dist

      - name: Upload DLL and host artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cnc-ddraw
          if-no-files-found: error
          # `dist/*` (rather than the target/... paths) keeps the artifact zip
          # flat: ddraw.dll and ddraw-host.exe at the root, ready to drop next
          # to the game executable after unzipping.
          path: dist/*
