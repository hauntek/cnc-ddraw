[package]
name = "cnc-ddraw"
version = "0.1.2"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "ddraw"
crate-type = ["cdylib"]

[workspace]
members = ["host", "protocol"]
resolver = "2"

[dependencies]
ddraw-protocol = { path = "protocol" }
fearless_simd = "1.2.0"
parking_lot = "0.12"
pollster = "0.4"
raw-window-handle = "0.6.2"
wgpu = { version = "27.0.1", default-features = false, features = ["std", "dx12", "vulkan", "wgsl"] }
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectDraw",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
debug = true
strip = "symbols"
